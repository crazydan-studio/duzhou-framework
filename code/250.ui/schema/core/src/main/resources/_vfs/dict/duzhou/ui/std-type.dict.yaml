# Note: YAML 也支持差量
label: UI 相关的数据类型
options:
  - value: int
    label: 整数值
  - value: boolean
    label: 布尔值

  - value: xui-color
    label: 颜色
    description: >
      其值可以为 \#00ff00、rgb(255,0,0)、rgba(255,0,0,1)、green、red 等形式
  - value: xui-size
    label: 尺寸
    description: >
      其值可以为 1u、1i、50%、match-parent、fit-content 等形式
  - value: xui-align
    label: 对齐模式
    description: >
      其可选值为：start、center、end
