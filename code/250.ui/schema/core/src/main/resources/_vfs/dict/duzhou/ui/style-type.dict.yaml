# Note: YAML 也支持差量
label: 与样式相关的数据类型
options:
  - value: "xui-null"
    label: null 属性，表示该属性需被移除
  - value: "xui-color"
    label: 颜色
    description: >
      其值可以为 \#00ff00、rgb(255,0,0)、rgba(255,0,0,1)、green、red 等形式
  - value: "xui-size"
    label: 尺寸
    description: >
      其值可以为 1u、1i、50%、match-parent、fit-content 等形式
  - value: "xui-align"
    label: 对齐模式
    description: >
      其可选值为：start、center、end
  - value: "xui-border-style"
    label: 边框样式
    description: >
      其可选值为：solid、dot、dash
